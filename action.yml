name: BM lint (bm-l10n)
description: Check English / Bahasa Melayu string files against a project termbase; the report goes to the run's Summary page.
author: Ahmad Razin Zainal Abidin
branding:
  icon: check-square
  color: blue
inputs:
  files:
    description: String files to check, separated by spaces (JSON tables, JS tables, JS with inline L() calls, Malay-only JS tables, HTML pages with en/ms sibling elements).
    required: true
  termbase:
    description: The project termbase CSV (en,bm,tier,reject,status,source,note). Leave empty for none.
    required: false
    default: ''
  patterns:
    description: A calque-pattern CSV. Leave empty for the list shipped with bm-l10n.
    required: false
    default: ''
  call:
    description: Names of the inline bilingual helpers, comma-separated (e.g. L,LL). name:k skips k leading arguments (tx:1 for tx(element, en, ms)).
    required: false
    default: 'L'
  pair-arrays:
    description: "'true' also reads two-string arrays [\"en text\", \"teks ms\"] as pairs (one of the two must contain a space)."
    required: false
    default: 'false'
  accepted:
    description: Findings the author has accepted (CSV rule,file,match,note); they leave the counts and are listed at the end of the report.
    required: false
    default: ''
  ignore:
    description: Rules to skip, comma-separated.
    required: false
    default: ''
  with:
    description: Opt-in rules to add, comma-separated (R03, the length rule, is off by default).
    required: false
    default: ''
  fail-on-fix:
    description: "'true' fails the check when there is at least one FIX finding."
    required: false
    default: 'true'
outputs:
  fix:
    description: Number of FIX findings.
    value: ${{ steps.lint.outputs.fix }}
  watch:
    description: Number of WATCH findings.
    value: ${{ steps.lint.outputs.watch }}
runs:
  using: composite
  steps:
    - id: lint
      shell: bash
      env:
        BML_FILES: ${{ inputs.files }}
        BML_TERMBASE: ${{ inputs.termbase }}
        BML_PATTERNS: ${{ inputs.patterns }}
        BML_CALL: ${{ inputs.call }}
        BML_PAIR_ARRAYS: ${{ inputs.pair-arrays }}
        BML_IGNORE: ${{ inputs.ignore }}
        BML_WITH: ${{ inputs.with }}
        BML_ACCEPT: ${{ inputs.accepted }}
        BML_FAIL: ${{ inputs.fail-on-fix }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh"
